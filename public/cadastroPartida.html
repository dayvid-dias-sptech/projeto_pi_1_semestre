<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OverStats | Cadastro de Partida</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="./assets/icon/overwatch-logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="cadastro" onload="carregarHerois()">
    <header class="header">
        <div class="logo">
            <a href="index.html" class="logo"><img src="assets/icon/overwatch-logo.png" alt="overwatch-logo"></a>
        </div>

        <nav class="menu">
            <a href="index.html#info-jogo">Informações do jogo</a>
            <a href="index.html#info-hero">Heróis</a>
            <a href="cadastroHeroi.html">Cadastro de Heróis</a>
            <a href="cadastroPartida.html">Cadastro de Partidas</a>
        </nav>

        <div class="actions">
            <span class="icon">🔍</span>
            <a href="cadastro.html"><span class="icon">👤</span>Conta</a>
        </div>
    </header>

    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <div class="container">
            <div class="card card-cadastro">
                <h2>Cadastro de Partida</h2>

                <div class="formulario">
                    <div class="campo">
                        <span>Herói usado:</span>
                        <select id="heroi_input">
                            <option value="">Selecione um herói</option>
                        </select>
                    </div>

                    <div class="campo">
                        <span>Eliminações:</span>
                        <input id="eliminacoes_input" type="number" placeholder="Quantidade de eliminações" />
                    </div>

                    <div class="campo">
                        <span>Mortes:</span>
                        <input id="mortes_input" type="number" placeholder="Quantidade de mortes" />
                    </div>

                    <div class="campo">
                        <span>Assistências:</span>
                        <input id="assistencias_input" type="number" placeholder="Quantidade de assistências" />
                    </div>

                    <div class="campo">
                        <span>Precisão geral (%):</span>
                        <input id="acerto_input" type="number" placeholder="Ex: 45" />
                    </div>

                    <div class="campo">
                        <span>Precisão crítica (%):</span>
                        <input id="critico_input" type="number" placeholder="Ex: 12" />
                    </div>

                    <div class="campo">
                        <span>Resultado da partida:</span>
                        <select id="resultadoPartida_input">
                            <option value="">Selecione o resultado</option>
                            <option value="1">Vitória</option>
                            <option value="0">Derrota</option>
                        </select>
                    </div>

                    <button class="botao" onclick="cadastrarPartida()">Cadastrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" />
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    if (!sessionStorage.ID_USUARIO) {
        window.location.href = "login.html";
    }

    function carregarHerois() {
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch("/herois/listar-por-usuario", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuarioServer: idUsuario
            })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (herois) {
                        for (var i = 0; i < herois.length; i++) {
                            heroi_input.innerHTML += `
              <option value="${herois[i].idHeroi}">
                ${herois[i].nomeHeroi}
              </option>
            `;
                        }
                    });
                } else {
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = "Erro ao carregar os heróis do usuário.";
                }
            })
            .catch(function (erro) {
                console.log(`#ERRO: ${erro}`);
            });
    }

    function cadastrarPartida() {
        var fkHeroi = Number(heroi_input.value);
        var eliminacoes = Number(eliminacoes_input.value);
        var mortes = Number(mortes_input.value);
        var assistencias = Number(assistencias_input.value);
        var acerto = Number(acerto_input.value);
        var critico = Number(critico_input.value);
        var resultadoPartida = Number(resultadoPartida_input.value);

        if (
            heroi_input.value == "" ||
            eliminacoes_input.value == "" ||
            mortes_input.value == "" ||
            assistencias_input.value == "" ||
            acerto_input.value == "" ||
            critico_input.value == "" ||
            resultadoPartida_input.value == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        fetch("/partidas/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                fkHeroiServer: fkHeroi,
                eliminacoesServer: eliminacoes,
                mortesServer: mortes,
                assistenciasServer: assistencias,
                porcentagemAcertoServer: acerto,
                porcentagemCriticoServer: critico,
                resultadoPartidaServer: resultadoPartida
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = "Partida cadastrada com sucesso!";

                    heroi_input.value = "";
                    eliminacoes_input.value = "";
                    mortes_input.value = "";
                    assistencias_input.value = "";
                    acerto_input.value = "";
                    critico_input.value = "";
                } else {
                    throw "Houve um erro ao tentar cadastrar a partida!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
