<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Overwatch | Cadastro de Herói</title>

  <script src="./js/sessao.js"></script>

  <!-- <link rel="stylesheet" href="./css/estilo.css" /> -->
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="./assets/icon/overwatch-logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="cadastro">
  <!--header inicio-->
  <header class="header">
    <div class="logo">
      <a href="index.html" class="logo"><img src="assets/icon/overstats.png" alt="overwatch-logo"></a>
    </div>

    <nav class="menu">
      <a href="index.html#info-jogo">Informações do jogo</a>
      <a href="index.html#info-mapas">Mapas</a>
      <a href="index.html#info-hero">Heróis</a>
      <a href="cadastroHeroi.html" class="logado">Cadastro de Heróis</a>
    </nav>

    <div class="acao">
      <div class="dropdown">
        <button class="dropbtn"><img class="user-logo" src="./assets/icon/user.png"> Conta</button>
        <div class="dropdown-conteudo">
          <a href="login.html">Login</a>
          <a href="cadastro.html">Cadastrar-se</a>
          <a href="cadastroPartida.html" class="logado">Partidas</a>
          <a href="./dashboard/dashboard.html" class="logado">Dashboard</a>
        </div>
      </div>
    </div>
  </header>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Nome do Herói:</span>
            <input id="nomeHeroi_input" type="text" placeholder="Nome do Herói" oninput="verificar()" />
          </div>
          <div class="campo">
            <span>Vida Base:</span>
            <input id="vidaBase_input" type="number" placeholder="Quantidade de vida base do Herói" oninput="verificar()" />
          </div>
          <div class="campo">
            <span>Dano Base:</span>
            <input id="danoBase_input" type="number" placeholder="Quantidade de dano base do Herói" oninput="verificar()" />
          </div>
          <div class="campo">
            <span>Tipo do herói:</span>
            <select id="tipoHeroi_input" onchange="verificar()">
              <option value="" disabled selected>Selecione uma classe</option>
              <option value="Tank">Tank</option>
              <option value="DPS">DPS</option>
              <option value="Suporte">Suporte</option>
            </select>
          </div>

          <div id="div_mensagem" class="mensagem-verificacao"></div>

          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

</body>

</html>

<script>

function verificar() {
    let nomeHeroi = nomeHeroi_input.value;
    let vidaBase = Number(vidaBase_input.value);
    let danoBase = Number(danoBase_input.value);
    let tipoHeroi = tipoHeroi_input.value;

    if (nomeHeroi == "" && vidaBase_input.value == "" && danoBase_input.value == "" && tipoHeroi == "") {
      div_mensagem.innerHTML = "";
      return false;
    }

    if (nomeHeroi.length < 2) {
      div_mensagem.innerHTML = "Informe um nome de herói com pelo menos 2 caracteres.";
      return false;
    }

    if (vidaBase <= 0 || vidaBase_input.value == "") {
      div_mensagem.innerHTML = "A vida base precisa ser maior que zero.";
      return false;
    }

    if (danoBase <= 0 || danoBase_input.value == "") {
      div_mensagem.innerHTML = "O dano base precisa ser maior que zero.";
      return false;
    }

    if (tipoHeroi == "") {
      div_mensagem.innerHTML = "Selecione o tipo do herói.";
      return false;
    }

    return true;
}

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeHeroi = nomeHeroi_input.value
    var vidaBase = vidaBase_input.value
    var danoBase = danoBase_input.value
    var tipoHeroi = tipoHeroi_input.value
    var fkUsuario = sessionStorage.ID_USUARIO;

    // Verificando se há algum campo em branco
    if (
      nomeHeroi == "" ||
      vidaBase == "" ||
      danoBase == "" ||
      tipoHeroi == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (!verificar()) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha os dados do herói corretamente.";
      return false;
    }

    // Enviando o valor da nova input
    fetch("/herois/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeHeroiServer: nomeHeroi,
        fkUsuarioServer: fkUsuario,
        vidaBaseServer: vidaBase,
        danoBaseServer: danoBase,
        tipoHeroiServer: tipoHeroi
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Herói cadastrado com sucesso! Redirecionando para dashboard";

          setTimeout(() => {
            window.location = "../dashboard/dashboard.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
