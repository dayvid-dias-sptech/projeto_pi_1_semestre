<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

  <script src="./js/sessao.js"></script>

  <!-- <link rel="stylesheet" href="./css/estilo.css" /> -->
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" href="./assets/icon/OverStats-logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body class="cadastro">
  <!--header inicio-->
  <header class="header">
    <div class="logo">
      <a href="index.html" class="logo"><img src="assets/icon/overstats.png" alt="overwatch-logo"></a>
    </div>

    <nav class="menu">
      <a href="index.html#info-jogo">Informações do jogo</a>
      <a href="index.html#info-mapas">Mapas</a>
      <a href="index.html#info-hero">Heróis</a>
      <a href="cadastroHeroi.html" class="logado">Cadastro de Heróis</a>
    </nav>

    <div class="acao">
      <div class="dropdown">
        <button class="dropbtn"><img class="user-logo" src="./assets/icon/user.png"> Conta</button>
        <div class="dropdown-conteudo">
          <a href="login.html">Login</a>
          <a href="cadastro.html">Cadastrar-se</a>
          <a href="cadastroPartida.html" class="logado">Partidas</a>
          <a href="./dashboard/dashboard.html" class="logado">Dashboard</a>
        </div>
      </div>
    </div>
  </header>
  <!--header fim-->

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>Nickname:</span>
            <input id="nickname_input" type="text" placeholder="Seu nickname" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="Seuemail@email.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" oninput="verificar()" />
            <div id="div_mensagem" class="mensagem-verificacao"></div>
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
          <p class="link-formulario">Já possui conta? <a href="login.html">Clique aqui</a></p>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/loading-overwatch.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

</body>

</html>

<script>

  let criterios = 0;
function verificar() {
    let senha = senha_input.value;
    let tamanho = senha.length >= 8;
    let maiusculas = senha != senha.toLowerCase();
    let minusculas = senha != senha.toUpperCase();
    criterios = 0;

    if (tamanho) criterios++;
    if (maiusculas) criterios++;
    if (minusculas) criterios++;

    if (senha == "") {
        div_mensagem.innerHTML = "";
        return false;
    } else if (criterios == 3) {
        div_mensagem.innerHTML = `Senha forte!`;
        return true;
    } else if (criterios == 2 && senha.length > 4) {
        div_mensagem.innerHTML = `Senha média. Use maiúsculas, minúsculas e pelo menos 8 caracteres.`;
    } else if (criterios == 2) {
        div_mensagem.innerHTML = `Senha fraca. Use maiúsculas, minúsculas e pelo menos 8 caracteres.`;
    } else if (criterios == 1) {
        div_mensagem.innerHTML = `Senha insegura. Use maiúsculas, minúsculas e pelo menos 8 caracteres.`;
    } else {
        div_mensagem.innerHTML = `Senha insegura. Use maiúsculas, minúsculas e pelo menos 8 caracteres.`;
    }

    return false;
}

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var nicknameVar = nickname_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      nicknameVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
        ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (!emailVar.includes("@") || !emailVar.includes(".")) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Informe um e-mail válido.";
      return false;
    }

    if (!verificar()) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "A senha precisa ter maiúsculas, minúsculas e pelo menos 8 caracteres.";
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não conferem.";
      return false;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        nicknameServer: nicknameVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
