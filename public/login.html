<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OverStats | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="./assets/icon/OverStats-logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body class="cadastro">

    <!--Header-->

    <header class="header">
    <div class="logo">
      <a href="index.html" class="logo"><img src="assets/icon/overstats.png" alt="overwatch-logo"></a>
    </div>

    <nav class="menu">
      <a href="index.html#info-jogo">Informações do jogo</a>
      <a href="index.html#info-mapas">Mapas</a>
      <a href="index.html#info-hero">Heróis</a>
      <a href="cadastroHeroi.html" class="logado">Cadastro de Heróis</a>
    </nav>

    <div class="acao">
      <div class="dropdown">
        <button class="dropbtn"><img class="user-logo" src="./assets/icon/user.png"> Conta</button>
        <div class="dropdown-conteudo">
          <a href="login.html">Login</a>
          <a href="cadastro.html">Cadastrar-se</a>
          <a href="cadastroPartida.html" class="logado">Partidas</a>
          <a href="./dashboard/dashboard.html" class="logado">Dashboard</a>
        </div>
      </div>
    </div>
  </header>


    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-login">
                <h2>Olá de volta!</h2>
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                    <p class="link-formulario">Ainda não possui conta? <a href="cadastro.html">Clique aqui</a></p>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/loading-overwatch.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>


</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(É necessário preencher os campos para efetuar o login)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NICKNAME_USUARIO = json.nickname;

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 3000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

  const linksLogados = document.querySelectorAll(".logado")

  if (sessionStorage.ID_USUARIO) {
  linksLogados.forEach((link) => {
    link.style.display = "block";
  })
}

</script>
