<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/OverStats-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverStats | Dashboards</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/style.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<body onload="validarSessao(), carregarGraficos()">

    <div class="janela">
        <img class="foto-dashboard" src="../assets/imgs/overstats-logotipo.png" alt="OverStats">

        <div class="header-left">
            <a class="logo-dashboard" href="../index.html">
                <img src="../assets/icon/overstats.png" alt="OverStats">
            </a>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">
                <a href="../dashboard/dashboard.html">
                    <h3>Gráficos</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="../index.html">
                    <h3>Home</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">

            <div id="graficos">
                <div class="graph grafico-terco">
                    <h3>Top 5 partidas por KDA</h3>
                    <canvas id="graficoTop5PartidasKda"></canvas>
                </div>

                <div class="graph grafico-terco">
                    <h3>KDA por herói</h3>
                    <canvas id="graficoKdaPorHeroi"></canvas>
                </div>

                <div class="graph grafico-terco">
                    <h3>Herói mais utilizado</h3>
                    <div class="destaque-heroi">
                        <span id="nomeHeroiMaisUtilizado">Sem dados</span>
                        <p>Herói tipo <span id="tipoHeroi"></span> com <span id="partidasRegistradas"></span> partidas
                            registradas</p>
                    </div>
                </div>

                <div class="graph grafico-duplo">
                    <h3>Média de eliminações por herói</h3>
                    <canvas id="graficoMediaEliminacoes"></canvas>
                </div>

                <div class="graph grafico-terco">
                    <h3>% de acerto crítica por herói</h3>
                    <canvas id="graficoPrecisaoCritica"></canvas>
                </div>

                <div class="graph grafico-duplo">
                    <h3>Kills, mortes e assistências por herói</h3>
                    <canvas id="graficoKmaPorHeroi"></canvas>
                </div>

            </div>
        </div>
    </div>

</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NICKNAME_USUARIO;

    const cores = {
        principal: '#C99423',
        secundaria: '#E3B062',
        azul: '#112547',
        vermelho: '#EF4444'
    };

    function obterDadosHeroiMaisUtilizado() {
        fetch('/partidas/heroi-mais-utilizado', { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    mostrarHeroiMaisUtilizado(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function mostrarHeroiMaisUtilizado(resposta) {
        // console.log("HERÓI MAIS UTILIZADO:", resposta); teste para saber pq não retornava o tipoheroi       
        if (resposta.length > 0) {
            nomeHeroiMaisUtilizado.innerHTML = resposta[0].nomeHeroi;
            partidasRegistradas.innerHTML = resposta[0].quantidadePartidas;
            tipoHeroi.innerHTML = resposta[0].tipoHeroi

        } else {
            nomeHeroiMaisUtilizado.innerHTML = "Sem dados";
            partidasRegistradas.innerHTML = "0";
        }
    }








    function obterDadosMediaEliminacoes() {
        fetch('/partidas/media-eliminacoes', { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarGraficoMediaEliminacoes(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }


    function plotarGraficoMediaEliminacoes(resposta) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: 'Média de eliminações',
                data: [],
                backgroundColor: cores.principal,
                borderRadius: 2
            }]
        };

        for (let i = 0; i < resposta.length; i++) {
            var registro = resposta[i];

            labels.push(registro.nomeHeroi);
            dados.datasets[0].data.push(registro.mediaEliminacoes);
        }

        const config = {
            type: 'bar',
            data: dados,
            options: {
                indexAxis: 'y',
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#D8D8D8',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    },

                    y: {
                        ticks: {
                            color: 'white',
                            font: {
                                size: 15,
                                weight: '700'
                            }
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        new Chart(
            document.getElementById('graficoMediaEliminacoes'),
            config
        );
    }












    function obterDadosKdaPorHeroi() {
        fetch('/partidas/kda-por-heroi', { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarGraficoKdaPorHeroi(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function plotarGraficoKdaPorHeroi(resposta) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: 'KDA médio',
                data: [],
                backgroundColor: cores.secundaria,
                borderRadius: 2
            }]
        };

        for (let i = 0; i < resposta.length; i++) {
            var registro = resposta[i];

            labels.push(registro.nomeHeroi);
            dados.datasets[0].data.push(registro.kda);
        }

        const config = {
            type: 'bar',
            data: dados,
            options: {
                indexAxis: 'y',
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#D8D8D8',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    },

                    y: {
                        ticks: {
                            color: 'white',
                            font: {
                                size: 15,
                                weight: '700'
                            }
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        new Chart(
            document.getElementById('graficoKdaPorHeroi'),
            config
        );
    }







    function obterDadosKmaPorHeroi() {
        fetch('/partidas/kma-por-heroi', { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarGraficoKmaPorHeroi(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function plotarGraficoKmaPorHeroi(resposta) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [
                {
                    label: 'Eliminações',
                    data: [],
                    backgroundColor: cores.principal,
                    borderRadius: 2
                },
                {
                    label: 'Mortes',
                    data: [],
                    backgroundColor: cores.vermelho,
                    borderRadius: 2
                },
                {
                    label: 'Assistências',
                    data: [],
                    backgroundColor: cores.secundaria,
                    borderRadius: 2
                }
            ]
        };

        for (let i = 0; i < resposta.length; i++) {
            var registro = resposta[i];

            labels.push(registro.nomeHeroi);
            dados.datasets[0].data.push(registro.mediaEliminacoes);
            dados.datasets[1].data.push(registro.mediaMortes);
            dados.datasets[2].data.push(registro.mediaAssistencias);
        }

        const config = {
            type: 'bar',
            data: dados,
            options: {
                plugins: {
                    legend: {
                        labels: {
                            color: '#D8D8D8',

                            font: {
                                size: 14,
                                weight: '600'
                            },

                            padding: 20
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#D8D8D8',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    },

                    y: {
                        ticks: {
                            color: 'white',
                            font: {
                                size: 15,
                                weight: '700'
                            }
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        new Chart(
            document.getElementById('graficoKmaPorHeroi'),
            config
        );
    }










    function obterDadosPrecisaoCritica() {
        fetch('/partidas/precisao-critica', { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarGraficoPrecisaoCritica(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function plotarGraficoPrecisaoCritica(resposta) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: 'Precisão crítica média (%)',
                data: [],
                backgroundColor: cores.principal,
                borderRadius: 2
            }]
        };

        for (let i = 0; i < resposta.length; i++) {
            var registro = resposta[i];

            labels.push(registro.nomeHeroi);
            dados.datasets[0].data.push(registro.mediaCritico);
        }

        const config = {
            type: 'bar',
            data: dados,
            options: {
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        display: false
                    }
                },

                scales: {
                    x: {
                        ticks: {
                            color: '#D8D8D8',
                            font: {
                                size: 14,
                                weight: '600'
                            }
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    },

                    y: {
                        ticks: {
                            color: 'white',
                            font: {
                                size: 15,
                                weight: '700'
                            }
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        new Chart(
            document.getElementById('graficoPrecisaoCritica'),
            config
        );
    }








    function obterDadosTop5PartidasKda() {
        fetch('/partidas/top-5-partidas-kda', { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    plotarGraficoTop5PartidasKda(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }



    function plotarGraficoTop5PartidasKda(resposta) {
        let labels = [];

        let dados = {
            labels: labels,
            datasets: [{
                label: 'KDA da partida',
                data: [],
                backgroundColor: cores.azul,
                borderRadius: 2
            }]
        };

        for (let i = 0; i < resposta.length; i++) {
            var registro = resposta[i];

            labels.push(registro.nomeHeroi + ' - Partida ' + registro.idPartida);
            dados.datasets[0].data.push(registro.kda);
        }

        const config = {
            type: 'bar',
            data: dados,
            options: {
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#D8D8D8',
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    },

                    y: {
                        ticks: {
                            color: 'white',
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        new Chart(
            document.getElementById('graficoTop5PartidasKda'),
            config
        );
    }

    function carregarGraficos() {
        obterDadosHeroiMaisUtilizado();
        obterDadosMediaEliminacoes();
        obterDadosKdaPorHeroi();
        obterDadosKmaPorHeroi();
        obterDadosPrecisaoCritica();
        obterDadosTop5PartidasKda();
    }

</script>
